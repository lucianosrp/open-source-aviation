name: Update Metadata

on:
  schedule:
    # 05:17 UTC. The OurAirports exports land around 01:53 UTC, so this picks
    # them up the same morning. Off-the-hour to avoid the scheduler's peak.
    - cron: "17 5 * * *"

  # Refresh immediately when a dataset link is added or the script changes.
  push:
    branches: [main]
    paths:
      - README.md
      - scripts/update_metadata.py
      - .github/workflows/update-metadata.yaml

  workflow_dispatch:

# Least privilege: the job only needs to push the regenerated README.
permissions:
  contents: write

# A scheduled run and a push-triggered run must never push concurrently, or one
# of them loses the race and fails. Queue instead of cancelling so a refresh
# already in flight is not thrown away.
concurrency:
  group: update-metadata
  cancel-in-progress: false

jobs:
  update:
    # Forks have no write access, so the inherited schedule would only ever
    # produce failures for them.
    if: github.repository == 'lucianosrp/open-source-aviation'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # The push step rebases if the branch moved under us, which needs
          # real history rather than a shallow clone.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.11.8"
          python-version: "3.12"
          # Avoids being rate-limited when fetching the uv release.
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Refresh metadata table
        env:
          # Lifts the commits API from 60 to 1,000 requests per hour.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The script has no dependencies, so there is nothing to install. It
        # writes a summary of the table and any warnings to the run summary,
        # and exits non-zero only if a dataset could not be resolved at all.
        run: uv run --script scripts/update_metadata.py

      - name: Commit and push
        run: |
          set -euo pipefail

          # Committing unconditionally is why this workflow used to fail on
          # every run where the upstream data had not changed.
          if git diff --quiet -- README.md; then
            echo "README.md is unchanged, nothing to commit."
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'Update data metadata table'

          # The branch can move between checkout and push. The table is
          # regenerated deterministically, so replaying our single commit on
          # top of whatever landed is always safe.
          for attempt in 1 2 3; do
            if git push; then
              echo "Pushed the refreshed table."
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}); rebasing onto origin/${GITHUB_REF_NAME}."
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          done

          echo "::error::Could not push after 3 attempts." >&2
          exit 1
